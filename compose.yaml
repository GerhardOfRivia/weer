services:
  weer:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - weer-data:/data
      - ./configs/docker.yaml:/app/weer.yaml:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  weer-data:
